<style>
:root{--bg:#0d0e12;--bg2:#15171d;--card:#1b1e26;--line:#2a2e39;--tx:#ecebe7;--mut:#9aa0ad;--y:#FFC93C;--b:#2D5BFF;--c:#FF5A5F;--sand:#F3ECE2;--ok:#3ddc97;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--y)}h1,h2,h3{font-family:"Space Grotesk",Inter,system-ui,sans-serif;letter-spacing:-.01em;line-height:1.2}
h1{font-size:28px;margin:0 0 6px}h2{font-size:22px;margin:28px 0 12px}h3{font-size:17px;margin:18px 0 8px}
.app{display:flex;min-height:100vh}
nav{width:250px;flex:0 0 250px;background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--y);color:#111;display:grid;place-items:center;font-weight:800;font-family:"Space Grotesk",sans-serif}
.brand b{display:block}.brand small{color:var(--mut)}
nav a{display:flex;gap:10px;align-items:center;color:var(--tx);text-decoration:none;padding:8px 10px;border-radius:10px;font-size:14px}
nav a:hover{background:#1f232c}nav a.on{background:rgba(255,201,60,.12);color:var(--y)}
nav .grp{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:14px 10px 4px}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,48px) 80px;max-width:1200px}
.top{display:none}
section{display:none}section.on{display:block;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.lead{color:var(--mut);max-width:820px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin-top:0}.card p{margin:.3em 0}
.kpi{font-size:28px;font-weight:800;font-family:"Space Grotesk",sans-serif}
.kpi small{font-size:13px;color:var(--mut);font-weight:500}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#262a35;color:var(--mut);white-space:nowrap}
.pill.curso{background:rgba(255,201,60,.15);color:var(--y)}.pill.estimado{background:rgba(154,160,173,.15)}.pill.oficial{background:rgba(61,220,151,.15);color:var(--ok)}
.pill.top{background:var(--c);color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.tab{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:600}
.tab.on{background:var(--y);color:#111;border-color:var(--y)}
.btn{background:var(--y);color:#111;border:0;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
.btn.sec{background:#262a35;color:var(--tx)}.btn.dang{background:transparent;color:var(--c);border:1px solid #4a2a2c}
.btn.sm{padding:4px 9px;font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:#181b22;position:sticky;top:0}
tr.done td{opacity:.6}tr.done td .it{text-decoration:line-through}
input,select,textarea{background:#12141a;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(255,201,60,.5);border-color:transparent}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--y)}
input.num{width:90px;text-align:right}input.qty{width:60px;text-align:right}
textarea{min-height:60px;resize:vertical}
.chk{list-style:none;padding:0;margin:0}.chk li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.chk li.d .t{text-decoration:line-through;color:var(--mut)}.chk .dd{color:var(--mut);font-size:13px}
.bar{height:10px;background:#262a35;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--c))}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1 1 150px;border-radius:12px;padding:56px 12px 10px;font-size:13px;border:1px solid var(--line)}
.wheel{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wheel .card.hl{border-color:var(--y)}
.note{background:rgba(255,90,95,.08);border:1px solid rgba(255,90,95,.35);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.note.y{background:rgba(255,201,60,.07);border-color:rgba(255,201,60,.35)}
.tot{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}.tot .card{flex:1 1 180px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
ul.clean{padding-left:18px}ul.clean li{margin:4px 0}
svg text{font-family:Inter,system-ui,sans-serif}
.flt{max-width:260px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--y);color:#111;padding:10px 14px;border-radius:10px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:860px){
 .app{display:block}nav{position:fixed;left:0;top:0;z-index:5;transform:translateX(-100%);transition:.25s;width:270px;box-shadow:0 0 40px #000}
 nav.open{transform:none}
 .top{display:flex;position:sticky;top:0;z-index:4;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 14px;gap:12px;align-items:center}
 .top button{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:18px}
 main{padding:18px 14px 80px}h1{font-size:23px}
 th,td{padding:6px}
}
@media print{nav,.top,.btn{display:none!important}section{display:block!important}}
</style>

<script>
const DEFAULT = {"_v":1,"meta":{"title":"Cuadrando · Universo de marca","hosts":"Carlos & Michelle","updated":"14 de octubre de 2026"},"universo":{"intro":"El podcast no es \"solo un podcast\" (curso: \"un pódcast nunca es solo un pódcast\"): es el HUB de un universo de marcas. Cada pieza le da audiencia, credibilidad o ingresos a las otras. Regla de oro: cada marca tiene identidad propia, pero todas comparten comunidad, base de datos y calendario.","nodes":[{"id":"pod","name":"Cuadrando (podcast)","rol":"HUB de contenido","desc":"Episodios largos en video (YouTube/Spotify) + clips. Es donde se juntan las audiencias de los tres: Carlos, Michelle y Mirani."},{"id":"carlos","name":"Marca personal de Carlos","rol":"Trading · Ventas/alianzas · IA · Música y marcas cool","desc":"Autoridad por resultados reales (payouts de prop firms con prueba), olfato comercial y la conexión con la escena musical/nocturna de Miami. Canales: IG/TikTok/X personales, hilos de X sobre trading, \"payout reveals\"."},{"id":"michelle","name":"Marca personal de Michelle","rol":"Founder tech · Bienestar · Vida de emprendedora joven","desc":"Cofundadora de Mirani: cuenta en primera persona cómo se construye una startup de bienestar a los 24. Canales: IG/LinkedIn/TikTok personales. [Completar con Michelle: otros intereses, tono personal, temas que NO quiere tocar]."},{"id":"mirani","name":"Mirani (empresa de Michelle)","rol":"App de bienestar / fitness","desc":"Plataforma para descubrir y reservar experiencias de bienestar (pilates, yoga, fuerza, pádel, recovery, etc.). Primer patrocinador \"de la casa\" y laboratorio de casos reales de startup."},{"id":"comunidad","name":"Comunidad propia","rol":"Newsletter · WhatsApp · Patreon","desc":"\"Las plataformas son prestadas, tu base de datos no\" (curso). Aquí se captura el dato de las 3 audiencias en un solo CRM."},{"id":"vlog","name":"Cuadrando de Noche (vlog)","rol":"Fiestas, bandas, eventos","desc":"Serie de reacciones/cobertura de eventos a los que los invitan; alimenta clips, invitados y relación con marcas."}],"links":[["carlos","pod","Segmento \"El Payout\" + sección de IA; trae audiencia de trading/X"],["michelle","pod","Segmento \"Diario de Founder\"; trae audiencia de emprendimiento/bienestar"],["mirani","pod","Slot de patrocinio \"de la casa\" (con disclosure) + episodios-caso"],["pod","comunidad","Cada episodio empuja a newsletter/WhatsApp (CTA único)"],["vlog","pod","Invitados y clips salen de la noche de Miami"],["carlos","mirani","Carlos aporta ventas/alianzas: marcas y estudios aliados"],["michelle","carlos","Crossovers en redes personales (colabs, duetos, lives)"],["mirani","comunidad","Retos de bienestar de la comunidad con reservas en Mirani"],["vlog","carlos","Marcas cool y música = contenido personal de Carlos"]],"crossovers":[{"t":"Slot \"Presentado por Mirani\"","d":"Un insert de 40–60 s por episodio (formato inspirado en el pre-roll del media kit de EDN). Siempre con disclosure: \"Mirani es la empresa de Michelle\". Cuando lleguen patrocinantes pagos, Mirani pasa a un slot fijo más corto."},{"t":"\"Cuadrando el Cuerpo\"","d":"Mini-serie trimestral: Carlos (trader, horario raro) vs. Michelle en un reto de 30 días de bienestar reservado por Mirani. Contenido para las 3 marcas a la vez."},{"t":"\"El Payout\" (Carlos)","d":"Segmento recurrente donde Carlos muestra un payout real con capturas verificables y cuenta qué salió bien/mal. Sin señales ni consejos de inversión."},{"t":"\"Diario de Founder\" (Michelle)","d":"5 minutos por episodio: la semana real de Mirani (métricas que quiera compartir, errores, contrataciones, inversionistas)."},{"t":"Episodios-caso","d":"Cada temporada, 1 episodio de \"abrir el capó\": cómo Carlos cerraría una alianza para Mirani en vivo (role-play de ventas con un founder invitado)."},{"t":"Audiencia compartida","d":"Un solo CRM con etiquetas por origen (podcast, Carlos, Michelle, Mirani). Newsletter única con secciones de cada uno."},{"t":"Eventos híbridos","d":"Grabación en vivo + clase de bienestar de un estudio aliado de Mirani + after con DJ/banda amiga del vlog."}],"reglas":["Cada marca conserva su identidad visual; el podcast tiene la suya (no usar el logo de Mirani como logo del show).","Disclosure SIEMPRE que se hable de Mirani o de una firma de trading con la que Carlos tenga relación (FTC).","Mirani no controla la línea editorial del podcast (independencia = credibilidad).","Acordar por escrito el uso de marca de Mirani (ver Legal), incluyendo aprobación de sus cofundadoras."]},"mirani":{"verificado":[{"f":"Mirani app fue presentada oficialmente en Maracaibo el miércoles 12 de agosto (2026) en Eleva Rooftop; sus creadoras son Michelle Bedoya, Marlyn Serra y Nicole Bedoya.","src":"Noticia al Día, 13-ago-2026 — noticiaaldia.com/al-dia/llega-mirani-app-innovacion-tecnologica-al-servicio-del-fitness/"},{"f":"Se describe como \"ecosistema digital\" que conecta usuarios, estudios de entrenamiento y marcas aliadas; disciplinas: gimnasio, boxeo, running, yoga, pilates, recovery, pádel.","src":"Noticia al Día (mismo artículo)"},{"f":"Cinco pilares: Bienestar Integral, Calidad Curada, Innovación, Crecimiento Compartido, Impacto Positivo. Instagram: @miranilife.","src":"Noticia al Día (mismo artículo)"},{"f":"Existe una app \"Mirani\" en Google Play (com.mirani.appmirani), actualizada el 14-sep-2026, categoría estilo de vida, para reservar pilates, yoga, funcional, HIIT, barre, cycling, boxeo, recovery, pádel, tenis, etc. La ficha la publica \"Miranii\" con dirección de desarrollador en Doral, FL.","src":"play.google.com/store/apps/details?id=com.mirani.appmirani"}],"noVerificado":["Que la ficha de Google Play sea exactamente la app de Michelle (la descripción coincide, pero la ficha no la nombra) → confirmar con Michelle.","Estructura legal/país de la empresa, inversión, número de usuarios, ciudades activas en Miami → [PENDIENTE: Michelle].","Ojo: hay otras empresas llamadas \"Mirani\" sin relación (p. ej. MIRANI TECH SL en España, Mirani Marketing en India, una LLC \"Mirani Global\" en Miami con otro miembro). No mezclarlas."],"placeholders":["Rol exacto de Michelle (CEO/COO/…): [completar]","Mercados activos: Maracaibo / Miami / otros: [completar]","Métricas que se pueden mostrar al aire: [completar]","Aprobación de Marlyn y Nicole para usar Mirani en el podcast: [pendiente]"]},"marca":{"mision":"Contar, sin filtro y con data, cómo se construye una vida y un negocio a los 20 y tantos siendo venezolanos en Miami: founders, IA, trading, cultura y la noche de la ciudad, para que nuestra audiencia aprenda, se ría y se atreva.","vision":"Ser el punto de encuentro (podcast + comunidad + eventos) de la nueva generación latina emprendedora en Miami, y una marca de medios rentable en 3 años.","valores":[["Autenticidad (obligatoria)","El curso lo dice claro: la originalidad es opcional, la autenticidad es obligatoria. Hablamos desde nuestra verdad."],["Curiosidad como autoridad","\"Autoridad a través del desconocimiento\": no somos expertos en todo; preguntamos mejor que nadie."],["Transparencia","Mostramos números reales (payouts, costos, métricas) y declaramos cada patrocinio."],["Pana primero","Trato de panas: cercano, respetuoso, sin humillar invitados ni audiencia."],["Ambición con los pies en la tierra","Soñamos en grande pero con plan, presupuesto y checklist."],["Orgullo venezolano y latino","Nuestra identidad es ventaja, no nostalgia: puente entre Venezuela, Latinoamérica y Miami."],["Constancia","\"Publica, sé constante\" (curso). Mejor un episodio bueno cada semana que uno perfecto cada mes."]],"arquetipo":{"principal":"El Explorador (deseo: Libertad · eje \"Spiritual Journey\")","secundario":"El Bufón / Jester (deseo: Placer · eje \"Connect to Others\")","porque":"Explorador: dos chamos que se fueron, se reinventaron en Miami y exploran mundos nuevos (IA, trading, startups, la noche). Su autoridad es la curiosidad. Bufón: el humor venezolano, el \"jajaja pana\" que hace que los temas pesados (dinero, IA) se sientan ligeros. Evitar caer en el Outlaw (rebeldía por rebeldía) o en el Ruler (gurú que da órdenes): la marca pregunta, no sermonea.","rueda":[["Provide Structure","Caregiver/Service · Ruler/Control · Artist/Innovation"],["Spiritual Journey","Innocent/Safety · Sage/Knowledge · Explorer/Freedom ✅"],["Leave a Mark","Outlaw/Liberation · Magician/Power · Hero/Mastery"],["Connect to Others","Lover/Intimacy · Jester/Pleasure ✅ · Everyman/Belonging"]]},"tono":[["Somos","cercanos, curiosos, directos, graciosos, con data"],["No somos","gurús, vendehúmo, groseros gratuitos, \"hustle culture\" tóxica"],["Idioma","Español venezolano natural (\"pana\", \"chamo\", \"qué ladilla\", \"burda de bueno\") con spanglish de Miami cuando sale solo. Nada forzado."],["Ritmo","Conversación rápida, cortes ágiles, cold open fuerte en los primeros 30 s."],["Estilo visual","Noche de Miami: oscuro, neón cálido, texturas de cinta/grano; light theme para lo público y dark theme para lo pago (como Chiste Interno)."]],"personas":[{"n":"Andrea, 23 — \"La que se vino\"","d":"Venezolana en Doral/Brickell, trabaja en marketing y quiere emprender. Ve YouTube en la cocina y TikTok en el metro. Quiere: referentes jóvenes y reales, tips prácticos. Dolor: síndrome del impostor, nostalgia."},{"n":"Diego, 26 — \"El trader de madrugada\"","d":"Latino en Florida/LatAm, paga challenges de prop firms y sigue cuentas de trading en X. Quiere: transparencia, no gurús. Dolor: pierde cuentas y nadie habla de eso."},{"n":"Valentina, 21 — \"Universitaria FIU/MDC\"","d":"Estudia negocios o comunicación, va a fiestas y conciertos, curiosa por la IA. Quiere: entretenimiento + aprender algo. Consume: Shorts, Reels, clips."},{"n":"Ricardo, 34 — \"El founder con experiencia\"","d":"Emprendedor latino establecido en Miami. Quiere: conectar con nueva generación, conocer marcas, posible patrocinio. Es el comprador de patrocinios y fuente de invitados."},{"n":"La diáspora en Venezuela/LatAm","d":"Gente en Caracas, Maracaibo, Bogotá, Madrid que sigue la vida en Miami. Gran volumen de vistas (nota del curso: el ingreso por anuncios depende de la ubicación del espectador)."}]},"onesheet":{"nombres":[["Cuadrando ⭐ (recomendado)","En Venezuela \"cuadrar\" es planear, arreglar, cerrar un trato o salir con alguien. Funciona para negocios, trading, alianzas y la noche."],["Pana Capital","Juego entre \"pana\" y capital (dinero/ciudad). Bueno para founders y trading."],["Fuera de Rango","Término de trading + \"fuera de lo normal\"."],["Dos Chamos y un Mic","Directo y gracioso; menos premium."],["Lo Que Hay","Expresión venezolana; noticias virales y cultura."],["El Cuadre","Variante corta de Cuadrando; útil como nombre de segmento o newsletter."]],"nota":"Antes de elegir: buscar el nombre en USPTO (Trademark Search), Spotify, YouTube y disponibilidad del MISMO handle en todas las plataformas (TIP PRO del curso).","tagline":"Cuadrando la vida, el negocio y la noche.","taglinesAlt":["De pana a pana, sin filtro.","Venezolanos en Miami cuadrando el futuro.","Se cuadra hablando."],"logline":"Carlos y Michelle, dos venezolanos de 24 años en Miami — un trader con payouts reales y una founder de tech — conversan con founders, creadores y artistas sobre dinero, IA, cultura viral y cómo se cuadra la vida en la ciudad.","sinopsis":"Cuadrando es un videopodcast semanal en español grabado en Miami. Carlos (trading con prop firms, ventas y alianzas, IA, música) y Michelle (cofundadora de Mirani, app de bienestar) mezclan conversación de panas con data real: cuánto cuesta emprender, cómo se gana (y se pierde) en trading, qué herramientas de IA usan de verdad y qué está pasando en internet esta semana. Alternan episodios entre ellos dos con invitados de la escena latina de Miami — founders, traders, músicos y creadores — y una serie de vlogs, \"Cuadrando de Noche\", desde las fiestas, conciertos y eventos de la ciudad. Es para la generación que se fue, se reinventó y quiere construir algo ":"No incluimos cifras de audiencia de estos shows porque no las verificamos; revisen sus canales para datos actuales.","sorprendeme":[{"t":"🏆 \"El Payout en Vivo\" (TOP 1)","d":"Una vez al mes, Carlos opera en vivo una cuenta de evaluación de prop firm con la audiencia mirando (live en YouTube con Super Chat). Si pasa, se celebra en el siguiente episodio; si la quema, se analiza sin vergüenza. Transparencia radical = confianza = comunidad. Siempre con disclaimer \"no es consejo financiero\".","top":true},{"t":"🏆 \"Cuadrando Live: Miami\" (TOP 2)","d":"Grabación trimestral con público en un rooftop/venue: episodio en vivo + clase de bienestar de un estudio aliado de Mirani + after con DJ/banda del vlog. Venta de entradas, patrocinante principal y clips para un mes. Es la fase 2 del curso (\"experimenta con eventos en vivo\") y el modelo EDN de shows y after party.","top":true},{"t":"🏆 \"El Cuadre Semanal\" newsletter + WhatsApp (TOP 3)","d":"Desde el día 1: cada miércoles, una newsletter corta (lo viral, la herramienta de IA de la semana, el payout de Carlos, el diario de founder de Michelle) y un canal de WhatsApp. Es la base de datos propia que pide el curso y lo que hará valioso el media kit.","top":true},{"t":"\"¿Se cuadra o no se cuadra?\"","d":"Bit recurrente: 3 noticias virales, cada uno vota con una paleta física amarilla (sí) o coral (no). Clip vertical perfecto."},{"t":"\"El Pitch de 60 segundos\"","d":"Founders de la audiencia mandan un video de 60 s; el mejor del mes viene al estudio a pitchar ante un invitado founder."},{"t":"\"Prompt Battle\"","d":"Carlos vs. Michelle vs. invitado: mismo reto, 5 minutos con IA, la audiencia vota el resultado."},{"t":"Mapa del \"Miami Latino\"","d":"Mapa interactivo (Google My Maps) de los sitios donde grabaron vlogs; los lugares pueden patrocinar su pin."},{"t":"Merch con lenguaje venezolano","d":"Drops limitados: gorra \"Cuadrando.\", franela \"Fuera de Rango\", taza \"Qué ladilla el lunes\". Drops ligados a eventos ( ección física en Florida (puede ser uno de ustedes o un servicio). Ojo: la info de la LLC es pública; un agente comercial protege la dirección de la casa de Carlos.","cost":"$125 (oficial)","cat":"Empresa","status":"Pendiente","notes":""},{"t":"Reporte anual de la LLC","d":"Se presenta entre el 1 de enero y el 1 de mayo de cada año desde el año siguiente a la formación. $138.75; después del 1 de mayo hay recargo de $400 ($538.75). Poner recordatorio.","cost":"$138.75/año (oficial)","cat":"Empresa","status":"Pendiente","notes":""},{"t":"EIN (número de identificación fiscal federal)","d":"Se solicita gratis en irs.gov después de formar la LLC. Necesario para banco, pagos de patrocinantes y AdSense a nombre de la empresa.","cost":"Gratis (oficial)","cat":"Empresa","status":"Pendiente","notes":""},{"t":"Operating agreement / acuerdo de cofundadores","d":"Definir: % de propiedad (ej. 50/50), aportes (equipo, dinero, el estudio en casa de Carlos), roles, toma de decisiones y desempates, vesting (ej. 4 años con cliff de 1), qué pasa si uno se va, compra de la parte del otro, propiedad del nombre/canal/marca y de las cuentas de redes, y relación con Mirani y con las marcas personales.","cost":"$0–100 plantilla · $800–2,500 con abogado (estimado)","cat":"Empresa","status":"Pendiente","notes":""},{"t":"Estatus migratorio y permiso de trabajo","d":"Si alguno está con visa, TPS, asilo u otro estatus, confirmar con un abogado de inmigración que puede ser dueño/miembro y recibir ingresos de la LLC antes de monetizar.","cost":"Consulta $150–300 (estimado)","cat":"Empresa","status":"Pendiente","notes":""},{"t":"Búsqueda y registro de marca (USPTO)","d":"1) Buscar en USPTO Trademark Search (gratis) el nombre y variantes. 2) Presentar en Trademark Center: $350 por clase si cumple los requisitos base (desde 18-ene-2025); +$100/clase si falta información; +$200/clase si usan descripción libre en vez del ID Manual. Para \"intent to use\": +$150/clase al declarar uso. Clases típicas: 41 (entretenimiento/podcast), 9 (contenido descargable), 25 (ropa/merch).","cost":"$350 por clase (oficial) + abogado opcional $500–1,500","cat":"Propiedad intelectual","status":"Pendiente","notes":""},{"t":"Dominio y handles","d":"Comprar dominio (.com y variantes) y reservar el mismo handle en YouTube, Spotify, TikTok, Instagram, X, Threads, WhatsApp, Patreon. Poner las cuentas a nombre de la LLC (correo de la empresa) y guardar accesos en un gestor de contraseñas compartido con 2FA.","cost":"$15–40/año (estimado)","cat":"Propiedad intelectual","status":"Pendiente","notes":""},{"t":"Release del invitado","d":"Formulario simple firmado antes de grabar: autoriza uso de imagen, voz y nombre en todas las plataformas, clips y promoción, sin pago (o con el pago acordado), y que el invitado no revelará info confidencial de terceros.","cost":"$0 plantilla · incluido en paquete con abogado","cat":"Contratos","status":"Pendiente","notes":""},{"t":"Release de locación","d":"Para grabar en venues, estudios aliados o casas de terceros: permiso por escrito del dueño/encargado.","cost":"$0 plantilla","cat":"Contratos","status":"Pendiente","notes":""},{"t":"Música, copyright y fair use (vlogs y reacciones)","d":"Usar música licenciada (librería con licencia comercial) en intros y edición. En fiestas/conciertos, la música de fondo puede activar Content ID o reclamos: usar fragmentos cortos, narración encima o pedir permiso a la banda/sello. Las reacciones dependen del \"fair use\" (comentario/crítica, transformación, poca cantidad, sin sustituir el original) que se evalúa caso por caso: no es garantía. Grabar bandas en vivo: pedir permiso del artista/promotor.","cost":"$150–250/año librería (estimado)","cat":"Propiedad intelectual","status":"Pendiente","notes":""},{"t":"Contratos de patrocinio + disclosure FTC","d":"Contrato con: entregables (pre-roll, mención, clip), fechas, pago, exclusividad, aprobación de guion, métricas, derechos de uso del contenido. FTC: declarar claramente cualquier relación material (\"patrocinado por\", \"Mirani es la empresa de Michelle\", links de afiliado) dentro del contenido y activar la etiqueta de contenido pagado en YouTube/IG/TikTok.","cost":"$0 plantilla · revisión $300–800 (estimado)","cat":"Contratos","status":"Pendiente","notes":""},{"t":"Contenido de trading (cumplimiento)","d":"No dar \"señales\" ni recomendaciones personalizadas; disclaimer \"contenido educativo, no es consejo financiero\"; mostrar payouts con prueba y sin prometer ganancias; declarar si hay afiliación con una prop firm. Revisar con abogado antes de vender cursos o comunidades de trading.","cost":"Incluido en revisión legal","cat":"Contratos","status":"Pendiente","notes":""},{"t":"Contratistas: editor(a), diseñador(a)","d":"Acuerdo de contratista independiente con cláusula work-for-hire + cesión de propiedad intelectual a la LLC, confidencialidad, plazos y pagos. Pedir W-9 y emitir 1099-NEC si corresponde.","cost":"$0 plantilla · revisión $200–500 (estimado)","cat":"Contratos","status":"Pendiente","notes":""},{"t":"Relación de propiedad intelectual con Mirani","d":"El podcast (nombre, logo, episodios) es de la LLC del podcast; Mirani es de su propia empresa y sus cofundadoras. Firmar un acuerdo simple de patrocinio/licencia de marca: uso de logo de Mirani, slot fijo, si es pagado o \"in-kind\", y que Mirani no tiene derechos sobre el podcast. Pedir aprobación de Marlyn Serra y Nicole Bedoya. Declarar el conflicto de interés al aire.","cost":"$0–500 (estimado)","cat":"Propiedad intelectual","status":"Pendiente","notes":""},{"t":"Cuenta bancaria de la empresa","d":"Abrir con Articles of Organization + EIN + operating agreement. Todo ingreso/gasto del podcast por esa cuenta (protege la responsabilidad limitada).","cost":"$0–15/mes (estimado)","cat":"Finanzas","status":"Pendiente","notes":""},{"t":"Impuestos: sales tax","d":"Florida cobra 6% de sales tax estatal + surtax del condado (Miami-Dade: 1% → 7%) sobre bienes tangibles: aplica a merch y entradas/eventos en ciertos casos. Patrocinios y servicios digitales generalmente no son tangibles, pero confirmen con el CPA. Si venden merch: registrarse con Florida Department of Revenue.","cost":"Registro gratis (verificar)","cat":"Finanzas","status":"Pendiente","notes":""},{"t":"Impuestos: income tax","d":"Florida no tiene impuesto estatal sobre la renta personal. Una LLC de varios miembros tributa por defecto como sociedad (Form 1065 + K-1). Impuesto federal y self-employment tax sobre ganancias; considerar pagos estimados trimestrales. Separar ingresos de trading de Carlos (personales) de los del podcast.","cost":"CPA $500–1,500/año (estimado)","cat":"Finanzas","status":"Pendiente","notes":""},{"t":"Licencia local de negocio (Local Business Tax Receipt)","d":"Miami-Dade y muchas ciudades exigen BTR, incluso para negocios desde casa; revisar también reglas de zonificación/HOA para el estudio en casa.","cost":"$50–150 (estimado, varía)","cat":"Empresa","status":"Pendiente","notes":""},{"t":"Seguros","d":"General liability (eventos y visitas al estudio), seguro de equipos (cámaras/micros), y a futuro media liability / E&O (difamación, copyright). Revisar si el seguro de la casa de Carlos cubre uso comercial.","cost":"$500–1,500/año (estimado)","cat":"Finanzas","status":"Pendiente","notes":""},{"t":"Política de privacidad y datos (newsletter/CRM)","d":"Aviso de privacidad en el formulario, opt-in claro, botón de baja (CAN-SPAM) y no compartir la base de datos sin consentimiento.","cost":"$0–100 (estimado)","cat":"Empresa","status":"Pendiente","notes":""}],"youtube":{"niveles":[{"n":"Nivel 1 · YPP ampliado (fan funding)","req":"500 suscriptores + 3 subidas públicas en los últimos 90 días + (3,000 horas de reproducción largas en 12 meses O 3 millones de vistas de Shorts en 90 días)","da":"Membresías del canal, Super Chat, Super Stickers, Super Thanks, Shopping. NO incluye anuncios.","fuente":"Ayuda de YouTube (verificado oct-2026)"},{"n":"Nivel 2 · YPP completo (anuncios)","req":"1,000 suscriptores + (4,000 horas de reproducción públicas en 12 meses O 10 millones de vistas de Shorts en 90 días)","da":"Todo lo anterior + anuncios en página de reproducción, anuncios en feed de Shorts y YouTube Premium.","fuente":"Curso + Ayuda de YouTube (verificado oct-2026)"}],"notas":["Las horas de Shorts NO suman a las 4,000 horas: son caminos separados.","Las vistas de anuncios pagados no cuentan para los umbrales (solo vistas orgánicas).","Requisitos: seguir las políticas de monetización, vivir en país elegible, sin strikes activos, verificación en 2 pasos y una cuenta de AdSense para YouTube.","En YouTube Studio > Ganar, activar \"Get notified\" para recibir aviso al ser elegible."],"matematica":"4,000 horas = 240,000 minutos. Con episodios de 60 min y 10 min promedio de visualización por vista, se necesitan ~24,000 vistas de episodios largos en 12 meses (≈ 460 por semana con 1 episodio semanal). Con 15 min promedio: ~16,000 vistas. Por eso: retención > vistas.","plan":[["Cadencia","1 episodio largo semanal (mismo día y hora) + 1 Short diario + 1 live mensual. Mínimo 3 subidas cada 90 días (requisito nivel 1) — ustedes van a tener ~13."],["Largo","Títulos con promesa clara + thumbnail con cara y 3 palabras; cold open de 30 s; capítulos (timestamps); pantallas finales a otro episodio para sumar horas."],["Shorts","3–5 por episodio, hook en 2 s, subtítulos, link al episodio relacionado (función \"video relacionado\"). Los Shorts dan exposición, no conversión (curso): su trabajo es llevar al largo."],["Lives","Live mensual (ej. El Payout en Vivo): suma horas largas y activa Super Chat cuando lleguen a nivel 1."],["Colaboraciones","Invitados que compartan el episodio; ir a otros podcasts (cross promotion)."],["Análisis","Revisar cada semana CTR, retención y fuente de tráfico en YouTube Studio; vidIQ y VIEWSTATS (curso)."]],"ingresos":[["Anuncios (AdSense)","Nivel 2. Depende de vistas, tipo de anuncio, ubicación del espectador y políticas (curso)."],["Membresías del canal","Suscripción mensual con beneficios (emojis, episodios antes, bonus). Desde nivel 1."],["Super Thanks / Super Chat / Stickers","Donaciones en comentarios y en vivo. Desde nivel 1."],["YouTube Premium","Parte del ingreso por vistas de usuarios Premium. Nivel 2."],["YouTube BrandConnect","Plataforma de YouTube para conectar creadores con marcas (contenido patrocinado)."],["Patrocinios directos","Menciones/pre-rolls vendidos con media kit (no dependen de YPP). Mirani como primer slot."],["Afiliados","Links de herramientas de IA, equipo de grabación, (con cuidado) plataformas de trading — siempre con disclosure."],["Shopping / merch","Promocionar merch propio en YouTube Shopping (nivel 1)."]],"adsense":[{"t":"Cuenta de Google del canal con verificación en 2 pasos","d":"","done":false},{"t":"Decidir titular: persona o LLC (el curso: la cuenta debe estar a tu nombre real con info fiscal verificada)","d":"","done":false},{"t":"Crear la cuenta de AdSense para YouTube DESDE YouTube Studio (no crear otra aparte)","d":"","done":false},{"t":"Completar información fiscal de EE. UU. (W-9 con SSN o EIN de la LLC) en AdSense","d":"","done":false},{"t":"Verificar dirección (PIN por correo postal) e identidad","d":"","done":false},{"t":"Agregar método de pago (cuenta bancaria de la empresa)","d":"","done":false},{"t":"Revisar el umbral de pago y registros mensuales; guardar reportes para el CPA","d":"","done":false}],"rateCard":{"titulo":"Ejemplo real del curso: media kit de Escuela de Nada (Tarifas 2025)","filas":[["1 mención en episodio","YouTube","1 episodio","USD $2,500 c/u"],["4 menciones","YouTube","4 episodios","USD $2,200 c/u"],["8 menciones","YouTube","8 episodios","USD $1,875 c/u"],["12 menciones + beneficio en Patreon EDN + 1 clip","YouTube","12 episodios","USD $1,500 c/u"]],"nota":"Formato de mención: pre-roll de 40 s en los primeros 30 min + banner/insert animado. Son tarifas de un podcast ya establecido: NO son su punto de partida. function getP(p){return p.split('.').reduce((o,k)=>o?.[k],S)}

 ['g','Visión general'],['inicio','🏠','Inicio'],['universo','🪐','Universo'],

 ['g','Contenido'],['episodios','🎙️','Temas y episodios'],['invitados','⭐','Invitados'],['vlog','🌙','Vlog: Cuadrando de Noche'],['inspiraciones','💡','Inspiraciones'],['sorprendeme','🚀','Sorpréndeme'],

 for(const s of SECTIONS){ if(s[0]==='g'){h+=`<div class="grp">${s[1]}</div>`;continue}

 $('#nav').innerHTML=h;

 const arr=getP(path);const d=arr.filter(x=>x.done).length;
 return `${title?`<h3>${title} <span class="pill">${d}/${arr.length}</span></h3>`:''}<ul class="chk">${arr.map((x,i)=>`<li class="${x.done?'d':''}"><input type="checkbox" data-b="${path}.${i}.done" ${x.done?'checked':''}><div><div class="t">${esc(x.t)}</div>${x.d?`<div class="dd">${esc(x.d)}</div>`:''}</div></li>`).join('')}</ul>`;
}

R.universo=()=>{
 const U=DEFAULT.universo;const P={pod:[450,270],carlos:[150,95],michelle:[750,95],mirani:[750,445],comunidad:[450,500],vlog:[150,445]};
 const col={pod:'#FFC93C',carlos:'#2D5BFF',michelle:'#FF5A5F',mirani:'#3ddc97',comunidad:'#F3ECE2',vlog:'#b18cff'};
 let lines='',badges='';U.links.forEach((l,i)=>{const[a,b]=[P[l[0]],P[l[1]]];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
  const curve=(l[0]==='carlos'&&l[1]==='mirani')||(l[0]==='michelle'&&l[1]==='carlos');
  if(curve){const cx=l[1]==='carlos'?450:800,cy=l[1]==='carlos'?40:0;lines+=`<path d="M${a[0]},${a[1]} Q${cx},${cy} ${b[0]},${b[1]}" stroke="#4a5060" stroke-width="2" fill="none" stroke-dasharray="6 5"/>`;badges+=`<circle cx="${(a[0]+2*cx+b[0])/4}" cy="${(a[1]+2*cy+b[1])/4}" r="12" fill="#262a35" stroke="#FFC93C"/><text x="${(a[0]+2*cx+b[0])/4}" y="${(a[1]+2*cy+b[1])/4+4}" text-anchor="middle" font-size="12" fill="#FFC93C" font-weight="700">${i+1}</text>`}
  else{lines+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#4a5060" stroke-width="2"/>`;badges+=`<circle cx="${mx}" cy="${my}" r="12" fill="#262a35" stroke="#FFC93C"/><text x="${mx}" y="${my+4}" text-anchor="middle" font-size="12" fill="#FFC93C" font-weight="700">${i+1}</text>`}});
 const nodes=U.nodes.map(n=>{const[x,y]=P[n.id];const big=n.id==='pod';const r=big?86:62;return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="${big?'#2a2412':'#1b1e26'}" stroke="${col[n.id]}" stroke-width="${big?4:2.5}"/><text x="${x}" y="${y-4}" text-anchor="middle" font-size="${big?17:13}" font-weight="800" fill="${col[n.id]}">${esc(n.name.split(' (')[0].replace('Marca personal de ','')).slice(0,22)}</text><text x="${x}" y="${y+15}" text-anchor="middle" font-size="11" fill="#9aa0ad">${esc(n.rol.split(' · ')[0]).slice(0,26)}</text></g>`}).join('');
 return `<h1>🪐 Universo</h1><p class="lead">${esc(U.intro)}</p>
 <div class="card" style="padding:8px"><svg viewBox="0 0 900 590" width="100%" role="img" aria-label="Mapa del universo de marca">${lines}${badges}${nodes}</svg></div>
 <div class="g2" style="margin-top:14px"><div class="card"><h3>Conexiones del mapa</h3><ol>${U.links.map(l=>`<li>${esc(l[2])}</li>`).join('')}</ol></div>
 <div class="card"><h3>Reglas del universo</h3>${list(U.reglas)}</div></div>
 <h2>Las piezas</h2><div class="grid">${U.nodes.map(n=>`<div class="card" style="border-top:3px solid ${col[n.id]}"><h3>${esc(n.name)}</h3><span class="pill">${esc(n.rol)}</span><p>${esc(n.desc)}</p></div>`).join('')}</div>
 <h2>Crossovers y segmentos compartidos</h2><div class="grid">${U.crossovers.map(c=>`<div class="card"><h3>${esc(c.t)}</h3><p>${esc(c.d)}</p></div>`).join('')}</div>
 <h2>Mirani: lo que encontramos (verificado)</h2><div class="card"><ul class="clean">${DEFAULT.mirani.verificado.map(v=>`<li>${esc(v.f)} <br><small style="color:var(--mut)">Fuente: ${esc(v.src)}</small></li>`).join('')}</ul>
 <h3>No verificado / ojo</h3>${list(DEFAULT.mirani.noVerificado)}<h3>Por completar con Michelle</h3>${list(DEFAULT.mirani.placeholders)}</div>`;
};

R.presupuesto=()=>{
 const items=S.budget[tier];const cats=[...new Set(items.map(x=>x.cat))];
 const sub=c=>items.filter(x=>x.cat===c).reduce((s,x)=>s+x.qty*x.price,0);

 return `<h1>💸 Presupuesto</h1><p class="lead">Cantidades pensadas para 2 hosts + 1 invitado. Prioridad del curso implícita: audio → luz → cámara. Edita precio, cantidad, nombre y marca lo comprado. No incluye computadora (asumimos que ya tienen una).</p>

 <div class="tot"><div class="card"><small>Total ${tier}</small><div class="kpi" id="bt">${money(tierTotal(tier))}</div></div><div class="card"><small>Comprado</small><div class="kpi" id="bb">${money(tierBought(tier))}</div></div><div class="card"><small>Falta</small><div class="kpi" id="bf">${money(tierTotal(tier)-tierBought(tier))}</div></div>
 <div class="card"><small>Por origen del precio</small><p><span class="pill curso">curso</span> ${money(src.curso)}<br><span class="pill oficial">oficial</span> ${money(src.oficial)}<br><span class="pill estimado">estimado</span> ${money(src.estimado)}</p></div></div>
 <div class="tw"><table><thead><tr><th>✔</th><th>Categoría</th><th>Ítem</th><th>Cant.</th><th>Precio u.</th><th>Subtotal</th><th>Fuente</th><th></th></tr></thead><tbody>
 ${items.map((x,i)=>{const p=`budget.${tier}.${i}`;return `<tr class="${x.bought?'done':''}"><td><input type="checkbox" data-b="${p}.bought" ${x.bought?'checked':''} title="Comprado"></td><td><input data-b="${p}.cat" value="${esc(x.cat)}" style="width:120px"></td><td><input class="it" data-b="${p}.item" value="${esc(x.item)}" style="min-width:240px">${x.note?`<small style="color:var(--mut)">${esc(x.note)}</small>`:''}</td><td><input class="qty" type="number" min="0" data-b="${p}.qty" data-n value="${x.qty}"></td><td><input class="num" type="number" min="0" step="0.01" data-b="${p}.price" data-n value="${x.price}"></td><td data-sub="${i}">${money(x.qty*x.price)}</td><td><select data-b="${p}.src" style="width:110px">${['curso','oficial','estimado'].map(s=>`<option ${s===x.src?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn dang sm" data-del="budget.${tier}" data-i="${i}">✕</button></td></tr>`}).join('')}
 </tbody></table></div>
 <div class="row" style="margin-top:10px"><button class="btn" data-add="budget">+ Agregar ítem</button></div>
 <h2>Subtotales por categoría</h2><div class="grid">${cats.map(c=>`<div class="card"><b>${esc(c)}</b><div class="kpi" style="font-size:20px">${money(sub(c))}</div></div>`).join('')}</div>

};

// eventos
document.addEventListener('input',e=>{const el=e.target;const p=el.dataset.b;if(!p)return;
 let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.n!==undefined)v=parseFloat(v)||0;setP(p,v);save();
 if(p.startsWith('budget.')){const i=p.split('.')[2];const x=S.budget[tier][i];const c=document.querySelector(`[data-sub="${i}"]`);if(c)c.textContent=money(x.qty*x.price);
  $('#bt')&&($('#bt').textContent=money(tierTotal(tier)));$('#bb')&&($('#bb').textContent=money(tierBought(tier)));$('#bf')&&($('#bf').textContent=money(tierTotal(tier)-tierBought(tier)));
  if(el.type==='checkbox')el.closest('tr').classList.toggle('done',v)}
 if(el.type==='checkbox'&&!p.startsWith('budget.')){const li=el.closest('li');if(li)li.classList.toggle('d',v)}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.rr!==undefined){rerender()}
 if(el.id==='file'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d._v)throw 0;S=d;for(const k in DEFAULT){if(!(k in S))S[k]=JSON.parse(JSON.stringify(DEFAULT[k]))}save();rerender();toast('Importado ✔')}catch(err){alert('Archivo no válido')}};r.readAsText(f);el.value=''}
});
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;
 if(el.dataset.tier){tier=el.dataset.tier;S._tier=tier;save();rerender()}
 if(el.dataset.del){if(!confirm('¿Eliminar esta fila?'))return;getP(el.dataset.del).splice(+el.dataset.i,1);save();rerender()}
 if(el.dataset.add==='budget'){S.budget[tier].push({id:'u'+Date.now(),cat:'Otro',item:'Nuevo ítem',qty:1,price:0,src:'estimado',note:'',bought:false});save();rerender()}
 if(el.dataset.add==='episodios'){S.episodios.unshift({t:'Nuevo episodio',pillar:DEFAULT.pilares[0][0],fmt:'',desc:'',status:'Idea'});save();rerender()}
 if(el.dataset.add==='invitados'){S.invitados.unshift({name:'Nuevo invitado',cat:'',why:'',via:'',status:'Wishlist',notes:''});save();rerender()}
 if(el.dataset.reset){getP(el.dataset.reset).forEach(x=>x.done=false);save();rerender()}
 if(el.id==='exp'){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cuadrando-estado-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Exportado ✔')}
 if(el.id==='imp'){$('#file').click()}
 if(el.id==='rst'){if(confirm('¿Borrar todos los cambios y volver al plan original?')){S=JSON.parse(JSON.stringify(DEFAULT));save();rerender();toast('Restablecido')}}
 if(el.id==='mb'){$('#nav').classList.toggle('open')}
});
window.addEventListener('hashchange',()=>show(cur()));
buildNav();show(cur());
</script>
</body>
</html>
